# render.yaml — Render.com deployment configuration
# Deploy this repo on https://render.com → "New Web Service" → connect GitHub repo

services:
  - type: web
    name: skillbytes-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free

    envVars:
      - key: MONGODB_URI
        sync: false          # Set this manually in Render dashboard → Environment tab
      - key: DATABASE_NAME
        value: quiz_app
      - key: ENVIRONMENT
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ALLOWED_ORIGINS
        value: '["https://quizflow-analytics.vercel.app", "http://localhost:5173"]'

    healthCheckPath: /health
